[project]
name = "luma"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic==0.113.0",
    "apscheduler>=3.11.2",
    "bcrypt==5.0.0",
    "discord.py>=2.7.1",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.2.2",
    "structlog>=25.5.0",
    "supabase>=2.29.0",
    "python-dateutil>=2.9.0",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

